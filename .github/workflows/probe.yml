name: Probe endpoint

# Answers "what does this API actually return?" from a machine that can
# reach it. Exists because two features shipped against endpoints that had
# been retired or renamed -- see the validation-gate rule in CLAUDE.md.
# Read-only, manual only. The one secret it can touch is the AI key, sent
# as a bearer header when auth=ai-key -- needed to list the provider's
# models -- and never printed.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "HTTPS JSON endpoint to describe"
        required: true
      auth:
        description: "Set to 'ai-key' to send the AI_API_KEY secret as a bearer token"
        required: false
        default: ""
      mode:
        description: "Set to 'fields' for a field census across a big id-keyed map"
        required: false
        default: ""
      key:
        description: "Print this one key's entry in full (e.g. DET) instead of the shape view"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Describe the response
        env:
          PROBE_URL: ${{ inputs.url }}
          PROBE_AUTH: ${{ inputs.auth }}
          PROBE_MODE: ${{ inputs.mode }}
          PROBE_KEY: ${{ inputs.key }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/probe_endpoint.py
