name: Sync feeds

# Vercel's Hobby plan caps its own cron at once per day, which is useless for
# injury news. GitHub Actions schedules run every 5 minutes minimum and are
# free on public repos, so the scheduler lives here and the work happens on
# the deployment.
#
# Two caveats, both documented in docs/HOSTING.md:
#  - Timing is best effort, and "best effort" turned out to mean a fifth of
#    what is asked for. MEASURED Aug 24 over 38 hours: 30 scheduled runs,
#    one every 1.32h on average against a cron asking for one every 0.25h,
#    with gaps as long as 3.6h. GitHub drops roughly four out of five runs
#    under load. Every run succeeds -- this is not a failure anybody can
#    see in the Actions tab, it is absence.
#
#    What it costs: the wire is up to ~3.5h behind between polls, and the
#    player index (refetched only past 20h) can sit a couple of hours over
#    its threshold waiting for a run. Nothing lies about it -- Data health
#    stamps each feed from its own fetch time -- but the app is less live
#    than the 15-minute cron implies. Fixing it means a scheduler that is
#    not GitHub's free tier (docs/GAP_REVIEW.md).
#  - On a public repo, scheduled workflows are disabled automatically after
#    60 days with no repository activity.

on:
  schedule:
    # Deliberately NOT */15, which asks for :00 :15 :30 :45 -- the top of
    # the hour is the most contended slot on GitHub's shared scheduler and
    # the one its own docs warn about, and the quarter-hours are nearly as
    # busy. Same four runs an hour, asked for at unpopular minutes.
    #
    # This is a mitigation, not a fix: measured Aug 24 the schedule
    # delivered one run every 1.32h against four an hour asked for.
    # Whether the offset actually helps is measurable from the run history
    # after a day or two -- if it does not, the answer is a scheduler that
    # is not GitHub's free tier (docs/GAP_REVIEW.md).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # lets you force a sync from the Actions tab

concurrency:
  group: sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        env:
          BASE_URL: ${{ vars.DEPLOY_URL || 'https://fb-bible-torro2.vercel.app' }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not set. Add it under Settings > Secrets > Actions."
            exit 1
          fi

          # -sS keeps curl quiet but still prints errors; the token goes in a
          # header, never the URL, so it stays out of logs and referrers.
          body=$(curl -sS -X POST "$BASE_URL/internal/sync" \
            -H "X-Sync-Token: $SYNC_TOKEN" \
            -w "\n%{http_code}" --max-time 120)

          status=$(echo "$body" | tail -1)
          payload=$(echo "$body" | sed '$d')

          echo "HTTP $status"
          echo "$payload"

          if [ "$status" != "200" ]; then
            echo "::error::Sync failed with HTTP $status"
            exit 1
          fi

          # Surface a failed publisher without failing the whole run -- four
          # of five sources updating is still a good sync.
          if echo "$payload" | grep -q '"sources_failed":\[\]'; then
            echo "All sources OK"
          else
            echo "::warning::One or more sources failed — see sources_failed above"
          fi

      # ESPN 403s Vercel's IP range, so the Vegas slate is fetched from this
      # runner and pushed to the deployment -- same division of labour as the
      # sync trigger itself. A failed fetch skips quietly; the stored slate
      # persists and Data health keeps its honest stamp. The push is
      # independent of the sync call, so a transient sync failure must not
      # block it -- hence the always-run condition on both steps.
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}

      - name: Push Vegas slate
        if: ${{ !cancelled() }}
        env:
          FBBIBLE_BASE: ${{ vars.DEPLOY_URL || 'https://fb-bible-torro2.vercel.app' }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # push_vegas imports app.feeds.vegas, and vegas reads
          # config.SEASON_YEAR (Aug 21) -- which pulls pydantic. The
          # runner installed only httpx, so this step died on import
          # every 15 minutes from Aug 21 22:27 to Aug 22 18:00 while the
          # stored slate kept serving under a request-time stamp that
          # made it look fresh. Install what the import chain actually
          # needs; the sync curl above is independent and kept working.
          python3 -m pip install --quiet httpx pydantic pydantic-settings
          python3 scripts/push_vegas.py
