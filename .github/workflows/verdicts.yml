name: AI verdicts

# Drafts one-line "AI draft:" verdicts for the newest wire items.
#
# Provider is Google AI Studio (owner's call, Aug 15) via its
# OpenAI-compatible endpoint. Free tier, no card.
#
# NEEDS the AI_API_KEY repository secret (GEMINI_API_KEY also accepted).
# Until it exists the job
# no-ops with a warning instead of failing, which is why the schedule can
# be on already: the feature starts producing the hour the key lands, with
# no code change and no red runs in the meantime.
#
# This previously ran on GitHub Models, retired 2026-07-30, and returned
# 410 Gone under a green check for a day. Hence the script now exits
# non-zero on a permanent rejection.

on:
  schedule:
    - cron: "41 * * * *" # hourly, after the :26-ish sync delivery window
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verdicts
  cancel-in-progress: true

jobs:
  verdicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stdlib only, on purpose: this step must not fail because of its
      # own dependencies. (The review step below is the one that needs an
      # install.)
      - name: Draft and post verdicts
        run: python3 scripts/draft_verdicts.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # The one secret this needs. GEMINI_API_KEY is accepted too, so
          # whichever name the key is stored under works.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: point at any other OpenAI-compatible provider.
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}

      # Second and third calls, same hour, same key. Both read a
      # server-assembled work list, so every number in their prompts came
      # out of our own store, and both run even if an earlier step failed
      # -- one surface's bad hour says nothing about the others. Four
      # requests an hour total stays far inside the free tier's
      # few-hundred-a-day budget.
      - name: Draft player capsules
        if: ${{ !cancelled() }}
        run: python3 scripts/player_capsules.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}

      - name: Explain the ADP movers
        if: ${{ !cancelled() }}
        run: python3 scripts/adp_mover_reads.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}

      # The review script imports app.feeds.vegas, and the app.feeds
      # package pulls in httpx at import time -- same reason sync-feeds
      # installs it before push_vegas.py. Without this the step dies on
      # ModuleNotFoundError before reviewing anything (runs 42-47 did).
      - name: Install the one dependency the review needs
        if: ${{ !cancelled() }}
        run: python3 -m pip install --quiet httpx

      # Second call, same hour, same key: checks the owner's TD leans
      # against the live line. Runs even if the verdicts step failed --
      # that failure says nothing about whether the leans can be reviewed.
      - name: Review the TD leans
        if: ${{ !cancelled() }}
        run: python3 scripts/review_predictions.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # The one secret this needs. GEMINI_API_KEY is accepted too, so
          # whichever name the key is stored under works.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: point at any other OpenAI-compatible provider.
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}
