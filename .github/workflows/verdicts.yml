name: AI verdicts

# Drafts one-line "AI draft:" verdicts for the newest wire items.
#
# Provider is Google AI Studio (owner's call, Aug 15) via its
# OpenAI-compatible endpoint. Free tier, no card.
#
# NEEDS the AI_API_KEY repository secret (GEMINI_API_KEY also accepted).
# Until it exists the job
# no-ops with a warning instead of failing, which is why the schedule can
# be on already: the feature starts producing the hour the key lands, with
# no code change and no red runs in the meantime.
#
# This previously ran on GitHub Models, retired 2026-07-30, and returned
# 410 Gone under a green check for a day. Hence the script now exits
# non-zero on a permanent rejection.

on:
  schedule:
    - cron: "41 * * * *" # hourly, after the :26-ish sync delivery window
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verdicts
  cancel-in-progress: true

jobs:
  verdicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stdlib only, on purpose: the job must not fail because of its own
      # dependencies.
      - name: Draft and post verdicts
        run: python3 scripts/draft_verdicts.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # The one secret this needs. GEMINI_API_KEY is accepted too, so
          # whichever name the key is stored under works.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: point at any other OpenAI-compatible provider.
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}
