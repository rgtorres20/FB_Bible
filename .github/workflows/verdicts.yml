name: AI verdicts

# Drafts one-line "AI draft:" verdicts for the newest wire items.
#
# SCHEDULE DISABLED 2026-08-15. This ran against GitHub Models, which was
# retired on 2026-07-30 -- every request returns HTTP 410 Gone, so the job
# never produced a single verdict while reporting green for a day. An
# hourly job that can only 410 is waste, so the cron is off until a
# provider is chosen (Groq or Google AI Studio free tiers, or paid Claude
# -- each needs one new secret). Restore by uncommenting the cron once
# MODELS_URL/MODEL and the bearer token in scripts/draft_verdicts.py point
# somewhere live. Manual dispatch stays on so the fix can be tested.

on:
  # schedule:
  #   - cron: "41 * * * *" # hourly, after the :26-ish sync delivery window
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: verdicts
  cancel-in-progress: true

jobs:
  verdicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stdlib only, on purpose: the job must not fail because of its own
      # dependencies.
      - name: Draft and post verdicts
        run: python3 scripts/draft_verdicts.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # Free-tier provider override (GitHub Models is being retired):
          # set AI_API_KEY as a repo secret and the two vars below to switch
          # to Groq / Google AI Studio. See scripts/draft_verdicts.py.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}
