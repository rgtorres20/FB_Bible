name: AI verdicts

# Drafts one-line "AI draft:" verdicts for the newest wire items.
#
# Provider is Google AI Studio (owner's call, Aug 15) via its
# OpenAI-compatible endpoint. Free tier, no card.
#
# NEEDS the AI_API_KEY repository secret (GEMINI_API_KEY also accepted).
# Until it exists the job
# no-ops with a warning instead of failing, which is why the schedule can
# be on already: the feature starts producing the hour the key lands, with
# no code change and no red runs in the meantime.
#
# This previously ran on GitHub Models, retired 2026-07-30, and returned
# 410 Gone under a green check for a day. Hence the script now exits
# non-zero on a permanent rejection.

on:
  schedule:
    - cron: "41 * * * *" # hourly, after the :26-ish sync delivery window
  workflow_dispatch:
    inputs:
      model:
        description: "One-run model override (e.g. models/gemini-flash-lite-latest); blank uses the configured model"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verdicts
  cancel-in-progress: true

jobs:
  verdicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two model calls an hour, deliberately. This job briefly made five
      # -- verdicts plus one per annotation surface -- and Google's
      # free-tier throttles ate whole evenings (runs 50-52, Aug 18): the
      # calls were fighting each other for the same quota. Everything but
      # verdicts now travels as sections of one batched request. All
      # stdlib-only: work lists are assembled server-side, so no installs
      # and every number in the prompts is one the app fetched.
      - name: Draft and post verdicts
        run: python3 scripts/draft_verdicts.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # The one secret this needs. GEMINI_API_KEY is accepted too, so
          # whichever name the key is stored under works.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: point at any other OpenAI-compatible provider.
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ inputs.model || vars.VERDICT_MODEL }}

      # Player capsules, ADP mover reads, the TD-lean review and the
      # Week 1 previews, one call. Runs even if the verdicts step failed
      # -- one surface's bad hour says nothing about the others.
      - name: Annotate the surfaces
        if: ${{ !cancelled() }}
        run: python3 scripts/annotate.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERDICT_API_URL: ${{ vars.VERDICT_API_URL }}
          VERDICT_MODEL: ${{ inputs.model || vars.VERDICT_MODEL }}
