<!-- App icon / favicon. Square, its own navy ground (a favicon cannot
     borrow the page's), and the mark scaled up with the wordmark dropped:
     at 32px the words are noise and the trophy is the only thing anyone
     can read. FSB stays because the icon is also the home-screen tile. -->
