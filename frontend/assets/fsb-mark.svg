<!-- Fantasy Sports Bible — the mark alone: an open book whose pages are a
     football field, under a trophy. Vector rather than the supplied PNG
     because this ships as a favicon, a PWA icon and a sidebar wordmark at
     sizes from 16px to 512px, and one file has to hold all of them.
     Colours are the brand's: deep navy field, gold rule and trophy. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Fantasy Sports Bible">
  <defs>
    <linearGradient id="fsbGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D66B"/>
      <stop offset="0.45" stop-color="#E5B32B"/>
      <stop offset="1" stop-color="#B8850F"/>
    </linearGradient>
    <linearGradient id="fsbGoldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8BC3C"/>
      <stop offset="1" stop-color="#A9790B"/>
    </linearGradient>
  </defs>

  <!-- Gold plate under the book: the thick edge the pages sit on. -->
  <path fill="url(#fsbGoldEdge)"
        d="M200 118 C152 96 92 90 34 104 L18 112 L18 250 L34 244
           C92 230 152 236 200 262 C248 236 308 230 366 244 L382 250
           L382 112 L366 104 C308 90 248 96 200 118 Z"/>

  <!-- Left page. Navy field, white border, ruled like a gridiron. -->
  <path fill="#12244A" stroke="#F4F6FB" stroke-width="7" stroke-linejoin="round"
        d="M196 112 C150 92 94 86 40 99 L40 231 C94 219 150 225 196 248 Z"/>
  <g stroke="#F4F6FB" stroke-width="3" opacity="0.85" fill="none">
    <path d="M62 101 L62 229"/><path d="M96 100 L96 232"/>
    <path d="M130 103 L130 236"/><path d="M164 108 L164 242"/>
  </g>
  <g fill="#F4F6FB" font-family="Helvetica, Arial, sans-serif" font-weight="700"
     font-size="19" opacity="0.95">
    <text x="72" y="176">10</text><text x="106" y="179">20</text>
    <text x="140" y="183">30</text>
  </g>

  <!-- Right page, mirrored. -->
  <path fill="#12244A" stroke="#F4F6FB" stroke-width="7" stroke-linejoin="round"
        d="M204 112 C250 92 306 86 360 99 L360 231 C306 219 250 225 204 248 Z"/>
  <g stroke="#F4F6FB" stroke-width="3" opacity="0.85" fill="none">
    <path d="M338 101 L338 229"/><path d="M304 100 L304 232"/>
    <path d="M270 103 L270 236"/><path d="M236 108 L236 242"/>
  </g>
  <g fill="#F4F6FB" font-family="Helvetica, Arial, sans-serif" font-weight="700"
     font-size="19" opacity="0.95">
    <text x="242" y="183">40</text><text x="278" y="179">20</text>
    <text x="312" y="176">10</text>
  </g>

  <!-- The spine. -->
  <path fill="#0B1A36" d="M195 110 L205 110 L205 258 L200 262 L195 258 Z"/>

  <!-- FSB plaque, sitting in the gutter under the trophy. -->
  <rect x="168" y="150" width="64" height="30" rx="5" fill="#0E2148"
        stroke="url(#fsbGoldEdge)" stroke-width="2.5"/>
  <text x="200" y="172" text-anchor="middle" fill="#F4F6FB"
        font-family="Helvetica, Arial, sans-serif" font-weight="800"
        font-size="18" letter-spacing="1.5">FSB</text>

  <!-- Trophy. -->
  <g fill="url(#fsbGold)" stroke="#8A6205" stroke-width="2" stroke-linejoin="round">
    <path d="M158 26 L242 26 L242 62 C242 100 224 124 200 124
             C176 124 158 100 158 62 Z"/>
    <path d="M158 34 L138 34 C126 34 120 44 120 56 C120 76 136 90 158 92
             L158 78 C144 76 134 68 134 57 C134 50 138 47 146 47 L158 47 Z"/>
    <path d="M242 34 L262 34 C274 34 280 44 280 56 C280 76 264 90 242 92
             L242 78 C256 76 266 68 266 57 C266 50 262 47 254 47 L242 47 Z"/>
    <path d="M192 122 L208 122 L208 146 L192 146 Z"/>
    <path d="M176 144 L224 144 L228 158 L172 158 Z"/>
  </g>
</svg>
