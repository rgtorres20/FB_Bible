[project]
name = "fb-bible-server"
version = "0.1.0"
description = "Phase 2 of the Fantasy Bible: Yahoo Fantasy API OAuth server"
requires-python = ">=3.11"

[tool.vercel]
# Vercel's Python runtime auto-detects FastAPI from requirements.txt and routes
# every request to this app. Naming the entrypoint explicitly avoids ambiguity
# with the other filenames it probes (app.py, index.py, server.py, ...).
# There is deliberately no vercel.json: the legacy `builds` key disables
# `rewrites`, bundles only the entrypoint, and cost three failed deploys.
# See docs/HOSTING.md.
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Without this, `pytest` cannot import `app`. `python -m pytest` happens to
# work because -m puts the cwd on sys.path, which hides the problem locally
# and breaks CI, where pytest is invoked directly.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() in argument defaults is the FastAPI idiom, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
